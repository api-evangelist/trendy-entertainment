name: Trendy Entertainment
description: 'Trendy Entertainment was a Gainesville, Florida video game studio best known for the Dungeon
  Defenders tower-defense action-RPG franchise. Insight Venture Partners acquired the studio in 2012 for
  ~$18.2M and exited in 2019 when founder Augi Lye led an employee buyback and rebranded the company as
  Chromatic Games (chromatic.games). The only developer-facing surface the studio ever shipped is the
  Dungeon Defenders Development Kit — an Unreal Engine 3 game-mod SDK distributed as free Steam DLC — not
  a public web/HTTP API. Enrichment pass found no OpenAPI, REST API, developer portal, or client SDK
  registries: this is a games company with no programmable API surface, so most scored artifact types are
  N/A rather than missing.'
